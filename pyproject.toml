[project]
name = "hailprint"
version = "0.1.0"
description = "Hail exposure map for Harris County from MRMS MESH."
requires-python = ">=3.12,<3.13"
dependencies = [
    "eccodes",
    "xarray",
    "numpy",
    "rasterio",
    "shapely",
    "geopandas",
    "pyogrio",
    "pyarrow",
    "matplotlib",
    "boto3",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hailprint"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
